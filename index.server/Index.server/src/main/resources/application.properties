## ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

## ── Banco de dados (Supabase local) ──────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.hibernate.ddl-auto=none

## ── Serviço Python de embedding ───────────────────────────────────────────────
index.embedding.service.url=http://localhost:5000
index.embedding.maxEmbeddingGenBatch=10

## ── Storage de conteúdo ──────────────────────────────────────────────────────
index.content.storage.dir=/workspace/content-storage
## Defina esta propriedade para sobrescrever o caminho padrão quando necessário.

chuncks_batch_concept_process=5
