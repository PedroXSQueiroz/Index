## ── Spring Boot DevTools ──────────────────────────────────────────────────────
## Intervalo entre verificações de mudança nos .class (ms)
spring.devtools.restart.poll-interval=2000

## Tempo de silêncio após a última mudança antes de reiniciar (ms)
## Evita reinicializações em cascata quando o IntelliJ grava vários arquivos
spring.devtools.restart.quiet-period=1000

## Caminhos adicionais monitorados além do classpath padrão
## Inclui os módulos de dependência montados como bind volumes
spring.devtools.restart.additional-paths=/workspace/index.concept/target/classes,/workspace/index.embedding/target/classes,/workspace/index.repo/target/classes
